name: Run XPLA E2E Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  module-resolve:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository 📝
        uses: actions/checkout@v4

      - name: Setup and Build
        uses: ./.github/actions/setup-build

      - name: Test Starship Image Preparation
        run: node --test e2e/starship/prepare-image.test.mjs

      - name: Run Module Resolve Tests
        run: pnpm test:module

  networks-xpla:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository 📝
        uses: actions/checkout@v4

      - name: Setup and Build
        uses: ./.github/actions/setup-build

      - name: Create Starship Cluster
        uses: helm/kind-action@v1.8.0
        with:
          cluster_name: kind-starship

      - name: Prepare Starship Image
        env:
          STARSHIP_CONFIG: config.workflow.yaml
          STARSHIP_KIND_CLUSTER: kind-starship
        run: |
          pnpm starship:build
          kind get kubeconfig --name kind-starship > "$RUNNER_TEMP/starship.kubeconfig"

      - name: Set Up Starship Infrastructure
        id: starship-infra
        uses: hyperweb-io/starship-action@1.1.0
        with:
          config: e2e/starship/configs/config.workflow.yaml
          kubeconfig: ${{ runner.temp }}/starship.kubeconfig

      - name: Wait for pod readiness
        run: |
          NAMESPACE="${{ steps.starship-infra.outputs.namespace }}"
          for i in {1..60}; do
            POD_NAME=$(kubectl get pods -n $NAMESPACE -o jsonpath='{.items[*].metadata.name}' | tr ' ' '\n' | grep -E 'dimension-.*-genesis-0' | head -1)
            if [ -n "$POD_NAME" ]; then
              kubectl wait --for=condition=ready pod/$POD_NAME --namespace $NAMESPACE --timeout=300s && break
            fi
            [ $i -eq 60 ] && exit 1
            sleep 5
          done

      - name: evm rpc port fowarding
        id: evm-rpc-port-fowarding
        run: |
          NAMESPACE="${{ steps.starship-infra.outputs.namespace }}"
          POD_NAME=$(kubectl get pods -n $NAMESPACE -o jsonpath='{.items[*].metadata.name}' | tr ' ' '\n' | grep -E 'dimension-.*-genesis-0' | head -1)
          [ -z "$POD_NAME" ] && exit 1
          kubectl port-forward pod/$POD_NAME 8545:8545 --namespace $NAMESPACE > /tmp/port-forward.log 2>&1 &
          PF_PID=$!
          sleep 3
          kill -0 $PF_PID 2>/dev/null || (cat /tmp/port-forward.log && exit 1)
          for i in {1..30}; do
            curl -s -f -X POST http://127.0.0.1:8545 -H "Content-Type: application/json" -d '{"jsonrpc":"2.0","method":"eth_blockNumber","params":[],"id":1}' > /dev/null 2>&1 && break
            [ $i -eq 30 ] && (cat /tmp/port-forward.log && exit 1)
            sleep 2
          done

      - name: Run E2E Tests
        env:
          STARSHIP_CONFIG: config.workflow.yaml
        run: |
          pnpm test:starship
